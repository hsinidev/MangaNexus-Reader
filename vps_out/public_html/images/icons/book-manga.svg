<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="128" fill="#090b11" stroke="#ea580c" stroke-width="4" stroke-opacity="0.15" />

  <!-- Action Speed Lines in Background -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.15">
    <line x1="60" y1="100" x2="140" y2="100" />
    <line x1="40" y1="160" x2="100" y2="160" />
    <line x1="50" y1="220" x2="120" y2="220" />
    <line x1="420" y1="290" x2="470" y2="290" />
    <line x1="390" y1="350" x2="450" y2="350" />
    <line x1="410" y1="410" x2="460" y2="410" />
  </g>

  <!-- Manga Book Group -->
  <g filter="url(#glow)">
    <!-- Back Cover Plate -->
    <path d="M120 120 L380 90 A20 20 0 0 1 400 110 L400 400 A20 20 0 0 1 380 420 L120 390 Z" fill="#1e1b4b" stroke="url(#fireGrad)" stroke-width="6" />

    <!-- Turning Pages (Left Side Stacked) -->
    <path d="M140 140 C 200 160, 240 130, 270 160 L270 380 C 240 350, 200 380, 140 360 Z" fill="#ffffff" />
    <path d="M150 130 C 200 150, 240 120, 280 150 L280 370 C 240 340, 200 370, 150 350 Z" fill="#f8fafc" />

    <!-- Turning Pages (Right Side Stacked) -->
    <path d="M280 150 C 310 120, 350 150, 400 130 L400 350 C 350 370, 310 340, 280 370 Z" fill="#f8fafc" />
    
    <!-- Spine Ring Binder/Scroll Center -->
    <rect x="264" y="110" width="32" height="290" rx="16" fill="url(#fireGrad)" />
    <line x1="280" y1="140" x2="280" y2="370" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" />

    <!-- Dynamic Turning Action Page (Floating middle) -->
    <path d="M280 150 C 250 200, 200 230, 220 300 C 250 250, 270 200, 280 370" fill="none" stroke="url(#fireGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Action Star / Sparkle of excitement -->
    <path d="M340 200 L345 215 L360 220 L345 225 L340 240 L335 225 L320 220 L335 215 Z" fill="#ffffff" />
    <path d="M180 280 L183 290 L193 293 L183 296 L180 306 L177 296 L167 293 L177 290 Z" fill="#facc15" />
  </g>
</svg>
