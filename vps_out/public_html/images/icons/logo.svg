<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient Palettes -->
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3a3a" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer (Subtle Dark Plate) -->
  <rect width="512" height="512" rx="128" fill="#090b11" stroke="#ff3a3a" stroke-width="4" stroke-opacity="0.15" />

  <!-- Grid overlay in background -->
  <g opacity="0.1">
    <path d="M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- Portal Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#portalGrad)" stroke-width="28" stroke-linecap="round" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="15 30" />

  <!-- Styled Manga Scroll (Ninja Scroll Motif) -->
  <g filter="url(#neonGlow)">
    <!-- Main Scroll Body -->
    <rect x="146" y="216" width="220" height="80" rx="16" fill="url(#scrollGrad)" transform="rotate(-30 256 256)" />
    
    <!-- Left Handle Roll -->
    <rect x="110" y="206" width="36" height="100" rx="10" fill="#0f172a" stroke="url(#portalGrad)" stroke-width="6" transform="rotate(-30 256 256)" />
    <circle cx="128" cy="256" r="8" fill="#ff3a3a" transform="rotate(-30 256 256)" />
    
    <!-- Right Handle Roll -->
    <rect x="366" y="206" width="36" height="100" rx="10" fill="#0f172a" stroke="url(#portalGrad)" stroke-width="6" transform="rotate(-30 256 256)" />
    <circle cx="384" cy="256" r="8" fill="#8b5cf6" transform="rotate(-30 256 256)" />

    <!-- Ribbon Tie -->
    <path d="M246 220 C260 210, 270 210, 276 226 L290 270" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M236 240 C250 250, 260 260, 266 276 L250 310" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Center Watermark Character -->
  <text x="256" y="280" font-family="'Courier New', monospace" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.9" filter="url(#neonGlow)">
    卍
  </text>
</svg>
